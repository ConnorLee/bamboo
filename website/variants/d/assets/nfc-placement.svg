<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">iPhone, pure gemstone carrier, hidden offset packaging NFC, paperboard stack</title><defs><linearGradient id="steel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#828881"/><stop offset=".22" stop-color="#e9e9e2"/><stop offset=".45" stop-color="#abb2ad"/><stop offset=".68" stop-color="#f9f8ef"/><stop offset="1" stop-color="#7a827b"/></linearGradient><linearGradient id="black"><stop stop-color="#252e2b"/><stop offset=".5" stop-color="#606762"/><stop offset="1" stop-color="#1f2926"/></linearGradient><linearGradient id="gold"><stop stop-color="#ac8750"/><stop offset=".4" stop-color="#e7cf97"/><stop offset="1" stop-color="#af8c4e"/></linearGradient><radialGradient id="gem"><stop stop-color="white" stop-opacity=".55"/><stop offset=".4" stop-color="white" stop-opacity=".1"/><stop offset="1" stop-color="#182923" stop-opacity=".5"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#587264"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#30473b;font-size:18px}.small{font-size:14px;fill:#6b756b}.label{font-size:22px}.line{fill:none;stroke:#587264;stroke-width:1.5}.dash{stroke-dasharray:5 6}</style><text x="55" y="55" class="label">THE PHONE READS THE BOX.</text><g transform="translate(340 88)"><rect width="300" height="92" rx="22" fill="#2b3c33"/><rect x="10" y="8" width="280" height="73" rx="15" fill="#d6decf"/><text x="42" y="49" class="small">iPhone top edge near stone</text></g><path class="line dash" marker-end="url(#arrow)" d="M490 191v53"/><ellipse cx="490" cy="276" rx="58" ry="22" fill="#718c77"/><path d="M432 275v17q58 22 116 0v-17" fill="url(#steel)"/><path d="M245 354l225-47 330 52-223 63z" fill="#e5dec9" stroke="#bbbaa3"/><path d="M565 343l52-11 115 19-53 15z" fill="none" stroke="#81927c" stroke-width="3" stroke-dasharray="5 5"/><path d="M577 344l39-8 94 16-31 9z" fill="none" stroke="#81927c" stroke-width="1.5"/><path d="M245 371l332 67 223-63v30l-223 66-332-69z" fill="#c6bea6"/><path class="line" d="M656 141h150"/><text x="822" y="147" class="small">PHONE</text><path class="line" d="M550 278h253"/><text x="822" y="284" class="small">STONE</text><path class="line" d="M729 349h74"/><text x="822" y="352" class="small">HIDDEN NFC</text><path class="line" d="M800 410h3"/><text x="822" y="416" class="small">PACKAGING</text><text x="55" y="528" class="label">Inlay immediately behind the stone, concealed in the nonmetallic nest.</text><text x="55" y="564" class="small">The scan gesture stays over the stone; the metal carrier stays outside the main antenna loop.</text><text x="55" y="596" class="small">Directly-under-stone layout is a test variant. Read margin, adjacent tags and phone cases need testing.</text></svg>