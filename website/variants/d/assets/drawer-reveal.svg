<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">Milestone six drawer and second message revealed when the stone is lifted</title><defs><linearGradient id="steel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#828881"/><stop offset=".22" stop-color="#e9e9e2"/><stop offset=".45" stop-color="#abb2ad"/><stop offset=".68" stop-color="#f9f8ef"/><stop offset="1" stop-color="#7a827b"/></linearGradient><linearGradient id="black"><stop stop-color="#252e2b"/><stop offset=".5" stop-color="#606762"/><stop offset="1" stop-color="#1f2926"/></linearGradient><linearGradient id="gold"><stop stop-color="#ac8750"/><stop offset=".4" stop-color="#e7cf97"/><stop offset="1" stop-color="#af8c4e"/></linearGradient><radialGradient id="gem"><stop stop-color="white" stop-opacity=".55"/><stop offset=".4" stop-color="white" stop-opacity=".1"/><stop offset="1" stop-color="#182923" stop-opacity=".5"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#587264"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#30473b;font-size:18px}.small{font-size:14px;fill:#6b756b}.label{font-size:22px}.line{fill:none;stroke:#587264;stroke-width:1.5}.dash{stroke-dasharray:5 6}</style><text x="55" y="55" class="label">ONE DRAWER. TWO MESSAGES. ONE STONE.</text><path d="M90 178h372v270H90z" fill="#c0b59a"/><path d="M108 197h336v229H108z" fill="#e6dfc9"/><text x="127" y="242" class="label">06 / Half of the circle.</text><text x="127" y="270" class="small">All of your effort.</text><rect x="149" y="286" width="250" height="105" rx="25" fill="#cdc7af"/><ellipse cx="273" cy="339" rx="42" ry="35" fill="url(#steel)"/><ellipse cx="273" cy="335" rx="32" ry="26" fill="#6e8b71"/><path class="line" marker-end="url(#arrow)" d="M487 324h80"/><path d="M602 178h307v270H602z" fill="#c0b59a"/><path d="M620 197h271v229H620z" fill="#e6dfc9"/><ellipse cx="755" cy="271" rx="38" ry="16" fill="#8b9d84"/><path class="line dash" d="M755 295v29"/><text x="638" y="338" class="small">Take a moment before</text><text x="638" y="361" class="small">you carry on.</text><text x="90" y="513" class="label">1 / Reveal the lid message</text><text x="90" y="549" class="small">2 / Read packaging NFC while stone rests in its nest</text><text x="602" y="513" class="label">3 / Lift the stone</text><text x="602" y="549" class="small">4 / Discover the second message</text><text x="90" y="604" class="small">Pull-out drawer isolates one tag. Woven lift ribbon avoids prying delicate mineral edges.</text></svg>