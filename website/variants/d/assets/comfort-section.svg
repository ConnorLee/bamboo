<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">Halo I comfort section with unvalidated dimensional targets</title><defs><linearGradient id="steel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#828881"/><stop offset=".22" stop-color="#e9e9e2"/><stop offset=".45" stop-color="#abb2ad"/><stop offset=".68" stop-color="#f9f8ef"/><stop offset="1" stop-color="#7a827b"/></linearGradient><linearGradient id="black"><stop stop-color="#252e2b"/><stop offset=".5" stop-color="#606762"/><stop offset="1" stop-color="#1f2926"/></linearGradient><linearGradient id="gold"><stop stop-color="#ac8750"/><stop offset=".4" stop-color="#e7cf97"/><stop offset="1" stop-color="#af8c4e"/></linearGradient><radialGradient id="gem"><stop stop-color="white" stop-opacity=".55"/><stop offset=".4" stop-color="white" stop-opacity=".1"/><stop offset="1" stop-color="#182923" stop-opacity=".5"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#587264"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#30473b;font-size:18px}.small{font-size:14px;fill:#6b756b}.label{font-size:22px}.line{fill:none;stroke:#587264;stroke-width:1.5}.dash{stroke-dasharray:5 6}</style><text x="55" y="57" class="label">SLIMNESS IS AN ENGINEERING ENVELOPE.</text><path d="M120 355q340 -85 680 0v45q-340 -85-680 0z" fill="url(#steel)" stroke="#8c998e"/><path d="M402 320q58-12 116-5v-20q-58-38-116 0z" fill="#829782" stroke="#526e5c"/><path d="M398 298v33h124v-33" fill="none" stroke="#809382" stroke-width="9"/><path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M859 281v120"/><path class="line dash" d="M530 281h350M810 401h70"/><text x="738" y="460" class="label">4.6 mm max target</text><text x="55" y="528" class="label">8 mm band width · 2.4 mm structural rail target · 61 × 46 mm medium fit mule</text><text x="55" y="566" class="small">Radius skin edges. Support the stone. Isolate clasp pressure. Test wrist flexion and sleeves.</text><text x="55" y="602" class="small">All dimensions unvalidated starting targets; local receiver stack may require a thicker envelope.</text></svg>