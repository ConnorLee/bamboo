<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">Three-stage bayonet concept with positive anti-rotation lock</title><defs><linearGradient id="steel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#828881"/><stop offset=".22" stop-color="#e9e9e2"/><stop offset=".45" stop-color="#abb2ad"/><stop offset=".68" stop-color="#f9f8ef"/><stop offset="1" stop-color="#7a827b"/></linearGradient><linearGradient id="black"><stop stop-color="#252e2b"/><stop offset=".5" stop-color="#606762"/><stop offset="1" stop-color="#1f2926"/></linearGradient><linearGradient id="gold"><stop stop-color="#ac8750"/><stop offset=".4" stop-color="#e7cf97"/><stop offset="1" stop-color="#af8c4e"/></linearGradient><radialGradient id="gem"><stop stop-color="white" stop-opacity=".55"/><stop offset=".4" stop-color="white" stop-opacity=".1"/><stop offset="1" stop-color="#182923" stop-opacity=".5"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#587264"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#30473b;font-size:18px}.small{font-size:14px;fill:#6b756b}.label{font-size:22px}.line{fill:none;stroke:#587264;stroke-width:1.5}.dash{stroke-dasharray:5 6}</style><text x="55" y="58" class="label">A SHORT TURN. A POSITIVE LOCK.</text><circle cx="165" cy="225" r="84" fill="url(#steel)"/><circle cx="165" cy="225" r="59" fill="#e9e9df"/><path d="M81 216h32v18h-32M249 216h-32v18h32" fill="#56695c"/><text x="147" y="394" class="">01</text><text x="115" y="435" class="label">Align</text><circle cx="490" cy="225" r="84" fill="url(#steel)"/><circle cx="490" cy="225" r="59" fill="#e9e9df"/><path d="M406 216h32v18h-32M574 216h-32v18h32" fill="#56695c"/><text x="472" y="394" class="">02</text><text x="440" y="435" class="label">Push + turn</text><circle cx="810" cy="225" r="84" fill="url(#steel)"/><circle cx="810" cy="225" r="59" fill="#e9e9df"/><path d="M726 216h32v18h-32M894 216h-32v18h32" fill="#56695c"/><text x="792" y="394" class="">03</text><text x="760" y="435" class="label">Seat + lock</text><path class="line" marker-end="url(#arrow)" d="M140 123v43M190 123v43"/><path d="M414 154a105 105 0 0 1 162 44" class="line" marker-end="url(#arrow)"/><path d="M846 202l16 12-26 33" fill="none" stroke="#304b38" stroke-width="8" stroke-linecap="round"/><text x="110" y="486" class="small">Keyed opposing lugs</text><text x="407" y="486" class="small">~25–35° concept travel</text><text x="723" y="486" class="small">No magnet-only retention</text><text x="55" y="561" class="label">Unwrapped track: entry ↓ → retained under lip → lock pocket</text><path d="M120 588v35h450v-15h80" fill="none" stroke="#718370" stroke-width="13"/><text x="690" y="617" class="small">Deliberate tool release</text></svg>