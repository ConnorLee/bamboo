<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Concealed underside clasp and two-size studies</title><desc id="desc">Three unselected mechanism envelopes: telescoping, sliding, micro-adjust. Two base sizes S/M and M/L each target 15 to 20 mm fine travel; wrist ranges not validated.</desc><rect width="1200" height="700" fill="#f7f7f5"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="27" fill="#333" font-weight="600" text-anchor="start">UNDERSIDE ADJUSTMENT / CANDIDATES</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="16" fill="#666" font-weight="400" text-anchor="start">WORKING ASSUMPTION — prefer established, manufacturable mechanisms</text><rect x="40" y="112" width="355" height="233" rx="8" fill="#fff" stroke="#d6d6d2"/><text x="60" y="145" font-family="Arial,sans-serif" font-size="17" fill="#333" font-weight="600" text-anchor="start">A / TELESCOPING</text><rect x="67" y="181" width="301" height="49" rx="6" fill="#c1c4c4" stroke="#5b6061"/><rect x="125" y="173" width="160" height="65" rx="6" fill="#e3e4e0" stroke="#5b6061"/><path d="M137,182 V229 M159,182 V229 M251,182 V229 M272,182 V229" stroke="#707777"/><path d="M115,270 H317 M123,264 l-8,6 8,6 M309,264 l8,6 -8,6" fill="none" stroke="#5b6061"/><text x="217" y="298" font-family="Arial,sans-serif" font-size="15" fill="#333" font-weight="400" text-anchor="middle">≈15–20 mm target fine travel</text><text x="217" y="324" font-family="Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="middle">Envelope only · lock details unresolved</text><rect x="425" y="112" width="355" height="233" rx="8" fill="#fff" stroke="#d6d6d2"/><text x="445" y="145" font-family="Arial,sans-serif" font-size="17" fill="#333" font-weight="600" text-anchor="start">B / CONCEALED SLIDING</text><rect x="452" y="181" width="301" height="49" rx="6" fill="#c1c4c4" stroke="#5b6061"/><rect x="510" y="173" width="160" height="65" rx="6" fill="#e3e4e0" stroke="#5b6061"/><path d="M525,191 h130 M525,221 h130" stroke="#707777"/><rect x="576" y="190" width="23" height="32" fill="#a2a6a5"/><path d="M500,270 H702 M508,264 l-8,6 8,6 M694,264 l8,6 -8,6" fill="none" stroke="#5b6061"/><text x="602" y="298" font-family="Arial,sans-serif" font-size="15" fill="#333" font-weight="400" text-anchor="middle">≈15–20 mm target fine travel</text><text x="602" y="324" font-family="Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="middle">Envelope only · lock details unresolved</text><rect x="810" y="112" width="355" height="233" rx="8" fill="#fff" stroke="#d6d6d2"/><text x="830" y="145" font-family="Arial,sans-serif" font-size="17" fill="#333" font-weight="600" text-anchor="start">C / MICRO-ADJUST CLASP</text><rect x="837" y="181" width="301" height="49" rx="6" fill="#c1c4c4" stroke="#5b6061"/><rect x="895" y="173" width="160" height="65" rx="6" fill="#e3e4e0" stroke="#5b6061"/><circle cx="929" cy="204" r="3" fill="#727a78"/><circle cx="952" cy="204" r="3" fill="#727a78"/><circle cx="975" cy="204" r="3" fill="#727a78"/><circle cx="998" cy="204" r="3" fill="#727a78"/><circle cx="1021" cy="204" r="3" fill="#727a78"/><path d="M885,270 H1087 M893,264 l-8,6 8,6 M1079,264 l8,6 -8,6" fill="none" stroke="#5b6061"/><text x="987" y="298" font-family="Arial,sans-serif" font-size="15" fill="#333" font-weight="400" text-anchor="middle">≈15–20 mm target fine travel</text><text x="987" y="324" font-family="Arial,sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="middle">Envelope only · lock details unresolved</text><text x="40" y="403" font-family="Arial,sans-serif" font-size="20" fill="#333" font-weight="600" text-anchor="start">TWO BASE CHASSIS ENVELOPES / SAME LIGHT + DARK GEOMETRY</text><ellipse cx="235" cy="506" rx="115" ry="63" fill="none" stroke="#a2a7a7" stroke-width="17"/><rect x="195" y="554" width="80" height="27" rx="4" fill="#c3c6c4" stroke="#606767"/><text x="235" y="512" font-family="Arial,sans-serif" font-size="23" fill="#333" font-weight="600" text-anchor="middle">S/M</text><ellipse cx="605" cy="506" rx="137" ry="63" fill="none" stroke="#a2a7a7" stroke-width="17"/><rect x="565" y="554" width="80" height="27" rx="4" fill="#c3c6c4" stroke="#606767"/><text x="605" y="512" font-family="Arial,sans-serif" font-size="23" fill="#333" font-weight="600" text-anchor="middle">M/L</text><text x="853" y="471" font-family="Arial,sans-serif" font-size="18" fill="#333" font-weight="600" text-anchor="start">No validated wrist ranges.</text><text x="853" y="503" font-family="Arial,sans-serif" font-size="16" fill="#333" font-weight="400" text-anchor="start">Prototype curvature, clearance,</text><text x="853" y="528" font-family="Arial,sans-serif" font-size="16" fill="#333" font-weight="400" text-anchor="start">pinch points and top orientation.</text><text x="40" y="631" font-family="Arial,sans-serif" font-size="17" fill="#333" font-weight="600" text-anchor="start">Secure mechanical closure • tool-free ordinary sizing • deliberate release • positive feedback desirable</text><text x="40" y="665" font-family="Arial,sans-serif" font-size="16" fill="#666" font-weight="400" text-anchor="start">Functional clasp strength, cycle life, adjustment retention and usable fit must pass separate P1/P2 tests.</text></svg>